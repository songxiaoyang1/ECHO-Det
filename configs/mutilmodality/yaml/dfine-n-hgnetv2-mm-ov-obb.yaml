  - [-1, MaxSigmoidAttnBlock, [128, 1, 128]] # 20-P4/16

  - [-1, SCDown, [128, 3, 2, 'silu']] # 21-P5/32
  - [[-1, 16], Concat, []] # 22-P5/32
