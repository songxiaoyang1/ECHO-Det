num_classes: 5
angle_factor: 3.141592653589793

train_dataloader:
  type: DataLoader
  dataset:
    type: MultimodalOBBDetection
    img_folder: /root/code/project/dataset_dronevehicle_obb_mm/images/train
    label_folder: /root/code/project/dataset_dronevehicle_obb_mm/labels/train
    modality_folder: /root/code/project/dataset_dronevehicle_obb_mm/modality_images/train
    modality_format: image
    modality_size_mismatch: error
    data_yaml: /root/code/project/dataset_dronevehicle_obb_mm/data.yaml
    # To test npy/npz modality:
    # modality_folder: null
    # npy_folder: /root/code/project/dataset_dronevehicle_obb_mm/modality_npy/train
    # modality_format: npy
    transforms:
      type: MultimodalOBBCompose
      ops:
        - {type: MultimodalOBBMosaic, output_size: 320, probability: 1.0, fill_value: 0, use_cache: False, max_cached_images: 50, random_pop: True}
        - {type: OBBRandomHorizontalFlip, p: 0.5}
        - {type: OBBRandomRotate, angle_range: 180, p: 0.5, fill: 0}
        - {type: OBBResize, size: [640, 640]}
        - {type: OBBSanitize, min_area: 1.0}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: NormalizeNPYMinMax}
        - {type: ConvertOBBBoxes, normalize: true, angle_factor: 3.141592653589793}
      policy:
        name: stop_epoch
        epoch: [4, 78, 148]
        ops: ['MultimodalOBBMosaic']
      mosaic_prob: 0.5
  collate_fn:
    type: BatchMultimodalCollateFunction
    base_size: 640
    base_size_repeat: ~
    mixup_prob: 0.0
  shuffle: true
  total_batch_size: 8
  num_workers: 8
  drop_last: true
  pin_memory: true

val_dataloader:
  type: DataLoader
  dataset:
    type: MultimodalOBBDetection
    img_folder: /root/code/project/dataset_dronevehicle_obb_mm/images/val
    label_folder: /root/code/project/dataset_dronevehicle_obb_mm/labels/val
    modality_folder: /root/code/project/dataset_dronevehicle_obb_mm/modality_images/val
    modality_format: image
    modality_size_mismatch: error
    data_yaml: /root/code/project/dataset_dronevehicle_obb_mm/data.yaml
    # To test npy/npz modality:
    # modality_folder: null
    # npy_folder: /root/code/project/dataset_dronevehicle_obb_mm/modality_npy/val
    # modality_format: npy
    transforms:
      type: MultimodalOBBCompose
      ops:
        - {type: OBBResize, size: [640, 640]}
        - {type: OBBSanitize, min_area: 1.0}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: NormalizeNPYMinMax}
        - {type: ConvertOBBBoxes, normalize: true, angle_factor: 3.141592653589793}
  collate_fn:
    type: BatchMultimodalCollateFunction
    base_size: 640
    base_size_repeat: ~
    mixup_prob: 0.0
  shuffle: false
  total_batch_size: 8
  num_workers: 8
  drop_last: false
  pin_memory: true
