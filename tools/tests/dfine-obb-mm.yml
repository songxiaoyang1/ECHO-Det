task: detection

# ---------- 指标部分 ----------
evaluator:
  type: OBBEvaluator
  metrics: ['yolo_obb']

# ---------- 数据集部分 ----------
num_classes: 5
ram_cache: false
eval_spatial_size: [640, 640]
angle_factor: 3.141592653589793

train_dataloader:
  type: DataLoader
  dataset:
    type: MultimodalOBBDetection
    # 这里填写你的图片文件夹(推荐全局路径)
    img_folder: /root/code/project/dataset_dronevehicle_obb_mm/images/train
    # 这里填写你的YOLO-OBB标签文件夹(推荐全局路径)
    label_folder: /root/code/project/dataset_dronevehicle_obb_mm/labels/train
    # 这里填写你的第二模态文件夹(推荐全局路径)
    modality_folder: /root/code/project/dataset_dronevehicle_obb_mm/modality_images/train
    modality_format: image
    modality_size_mismatch: error
    # 这里填写你的YOLO data.yaml文件路径(推荐全局路径)
    data_yaml: /root/code/project/dataset_dronevehicle_obb_mm/data.yaml
    transforms:
      type: MultimodalOBBCompose
      ops:
      - {type: OBBRandomHorizontalFlip, p: 0.5}
      - {type: OBBRandomRotate, angle_range: 180, p: 0.5, fill: 0}
      - {type: OBBResize, size: [640, 640]}
      - {type: OBBSanitize, min_area: 1.0}
      - {type: ConvertPILImage, dtype: float32, scale: true}
      - {type: NormalizeNPYMinMax}
      - {type: ConvertOBBBoxes, normalize: true, angle_factor: 3.141592653589793}
      policy: ~
      mosaic_prob: ~

  total_batch_size: 8
  num_workers: 8

  shuffle: true
  drop_last: true
  pin_memory: true
  collate_fn:
    type: BatchMultimodalCollateFunction
    base_size: 640
    base_size_repeat: ~
    ema_restart_decay: 0.9999
    stop_epoch: 120

val_dataloader:
  type: DataLoader
  dataset:
    type: MultimodalOBBDetection
    # 这里填写你的图片文件夹(推荐全局路径)
    img_folder: /root/code/project/dataset_dronevehicle_obb_mm/images/test
    # 这里填写你的YOLO-OBB标签文件夹(推荐全局路径)
    label_folder: /root/code/project/dataset_dronevehicle_obb_mm/labels/test
    # 这里填写你的第二模态文件夹(推荐全局路径)
    modality_folder: /root/code/project/dataset_dronevehicle_obb_mm/modality_images/test
    modality_format: image
    modality_size_mismatch: error
    # 这里填写你的YOLO data.yaml文件路径(推荐全局路径)
    data_yaml: /root/code/project/dataset_dronevehicle_obb_mm/data.yaml
    transforms:
      type: MultimodalOBBCompose
      ops:
      - {type: OBBResize, size: [640, 640]}
      - {type: OBBSanitize, min_area: 1.0}
      - {type: ConvertPILImage, dtype: float32, scale: true}
      - {type: NormalizeNPYMinMax}
      - {type: ConvertOBBBoxes, normalize: true, angle_factor: 3.141592653589793}

  total_batch_size: 16
  num_workers: 8

  shuffle: false
  drop_last: false
  pin_memory: true
  collate_fn:
    type: BatchMultimodalCollateFunction

# ---------- 模型部分 ----------
model: DEIM_MG
DEIM_MG:
  yaml_path: configs/mutilmodality/yaml/dfine-s-obb-mm.yaml
  pretrained: weight/hgnetv2/PPHGNetV2_B0_stage1_MG.pth # ~ 代表预训练权重为None，不使用

epoches: 132

postprocessor: OBBPostProcessor

baseline_log_monitor:
  enabled: False
  path: outputs/baseline/log.txt
  metric: test_yolo_obb[0]
  start_ratio: 0.5 # 训练到总 epoch 的 50% 后开始判定早停
  min_ap_gap: 0.02 # AP 低于 baseline 超过 0.02，即低 2 个点
  patience: 1 # 连续 1 轮超过差距才停止

# ---------- 跟输出有关系的参数 ----------
print_freq: 2000 # 当verbose_type选择为origin时候，训练日志的打印频率
verbose_type: origin
output_dir: ./outputs_tests/dfine_obb_mm_dronevehicle

# ---------- 优化器部分 ----------
optimizer:
  type: AdamW
  params:
  - params: ^(?=.*backbone)(?!.*norm|bn).*$
    lr: 0.0001
  - params: ^(?=.*backbone)(?=.*norm|bn).*$
    lr: 0.0001
    weight_decay: 0.0
  - params: ^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$
    weight_decay: 0.0
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# ---------- 损失函数部分 ----------
criterion: OBBDEIMCriterion
OBBDEIMCriterion:
  weight_dict:
    loss_vfl: 1
    loss_bbox: 5
    loss_probiou: 2
    loss_fgl: 0.15
    loss_ddf: 1.5
    loss_ddf_angle: 1.5
  losses: [vfl, boxes, local]
  alpha: 1.0
  gamma: 0.0
  vfl_iou_type: prob_iou
  reg_max: 32
  matcher:
    type: OBBHungarianMatcher
    weight_dict:
      cost_class: 2
      cost_bbox: 5
      cost_probiou: 2
    alpha: 0.25
    gamma: 2.0
use_focal_loss: true

# ---------- 一般不需要改动的部分 ----------
remap_mscoco_category: false # 除非你跑的是coco数据集，否则都是false
sync_bn: true
find_unused_parameters: true
use_amp: false
scaler:
  type: GradScaler
  enabled: true
use_ema: true
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
  start: 0
plot_train_batch_freq: 12
checkpoint_freq: 12
cache_imgsz: 960
clip_max_norm: 0.1
warmup_iter: 500
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
lr_scheduler:
  type: MultiStepLR
  milestones: [500]
  gamma: 0.1
lrsheduler: flatcosine
lr_gamma: 1
flat_epoch: 4000000
no_aug_epoch: 0
OBBPostProcessor:
  num_top_queries: 300
