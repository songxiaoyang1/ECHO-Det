__include__: [
  'dfine_hgnetv2_l_mm_obb_runtime_only.yml',
]

output_dir: ./outputs/dfine_hgnetv2_l_mm_ov_obb
text_cache_file: text_embedding/tips_v2_dronevehicle_text_cache.pth
model: OVDEIM_MG

OVDEIM_MG:
  yaml_path: configs/mutilmodality/yaml/dfine-l-obb-mm-ov.yaml
  img_dim: 256
  text_dim: 768
  text_adapter_layers: 1

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: OBBRandomHorizontalFlip, p: 0.5}
        - {type: OBBRandomRotate, angle_range: 180, p: 0.5, fill: 0}
        - {type: OBBResize, size: [640, 640]}
        - {type: OBBSanitize, min_area: 1.0}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: NormalizeNPYMinMax}
        - {type: ConvertOBBBoxes, normalize: true, angle_factor: 3.141592653589793}
        - {type: RandomLoadTexts, num_classes: 5}
        - {type: LookupTextFeats}
