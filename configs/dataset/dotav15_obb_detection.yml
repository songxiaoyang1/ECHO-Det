num_classes: 16
angle_factor: 3.141592653589793

train_dataloader:
  type: DataLoader
  dataset:
    type: OBBDetection
    img_folder: /root/code/project/datasets/DOTAv1.5/images/train
    label_folder: /root/code/project/datasets/DOTAv1.5/labels/train
    data_yaml: /root/code/project/datasets/DOTAv1.5/data.yaml
    transforms:
      type: Compose
      ops:
        - {type: OBBRandomHorizontalFlip, p: 0.5}
        - {type: OBBRandomRotate, angle_range: 180, p: 0.5, fill: 0}
        - {type: OBBResize, size: [640, 640]}
        - {type: OBBSanitize, min_area: 1.0}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: ConvertOBBBoxes, normalize: true, angle_factor: 3.141592653589793}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: ~
  shuffle: true
  total_batch_size: 8
  num_workers: 8

val_dataloader:
  type: DataLoader
  dataset:
    type: OBBDetection
    img_folder: /root/code/project/datasets/DOTAv1.5/images/val
    label_folder: /root/code/project/datasets/DOTAv1.5/labels/val
    data_yaml: /root/code/project/datasets/DOTAv1.5/data.yaml
    transforms:
      type: Compose
      ops:
        - {type: OBBResize, size: [640, 640]}
        - {type: OBBSanitize, min_area: 1.0}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: ConvertOBBBoxes, normalize: true, angle_factor: 3.141592653589793}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: ~
  shuffle: false
  total_batch_size: 8
  num_workers: 8
